<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma première page</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>
<body>
    <h1>Bonjour !</h1>
    <p>Ceci est une page HTML très simple.</p>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
<button id="installBtn" hidden>Installer</button>
<script>
let dp;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); dp = e; installBtn.hidden = false;
});
installBtn.onclick = async () => { dp.prompt(); await dp.userChoice; };
</script>
</body>
</html>
